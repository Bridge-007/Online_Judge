version: '3.9'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DATABASE_URL=postgres://warcode:warcode@db:5432/warcode
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # For sandbox containers
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: warcode
      POSTGRES_USER: warcode
      POSTGRES_PASSWORD: warcode
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
