{% extends 'base.html' %}

{% block title %}Password Reset Complete — WarCode{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body text-center py-5">
                <i class="bi bi-check-circle" style="font-size: 3rem; color: var(--success);"></i>
                <h3 class="mt-3 mb-3">Password Reset Successful!</h3>
                <p class="text-muted">
                    Your password has been set. You can now log in with your new password.
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary mt-2">
                    <i class="bi bi-box-arrow-in-right"></i> Log In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
