{% extends 'base.html' %}

{% block title %}Email Sent — Online Judge{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body text-center py-5">
                <i class="bi bi-envelope-check" style="font-size: 3rem; color: var(--success);"></i>
                <h3 class="mt-3 mb-3">Check Your Email</h3>
                <p class="text-muted">
                    If an account exists with the email you entered, we've sent a password reset link.
                    Please check your inbox (and spam folder).
                </p>
                <a href="{% url 'login' %}" class="btn btn-outline-primary mt-2">
                    <i class="bi bi-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
